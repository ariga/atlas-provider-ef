name: CD - Build and Publish NuGet Package

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: List SDKs
        shell: pwsh
        run: dotnet --list-sdks
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake CI
        shell: pwsh
        run: dotnet cake --target=CI
      - name: Publish artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: "./artifacts"

  test-tool:
    name: Test tool on ${{ matrix.os }} with .NET ${{ matrix.dotnet }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        dotnet: ['8.0', '9.0', '10.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Need net6.0 for the tool, net8.0 for MinVer, and matrix SDK for the demo app target.
          dotnet-version: |
            6.0.x
            8.0.x
            ${{ matrix.dotnet }}.x
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
          path: "./artifacts"
      - name: Pack and install AtlasEF tool locally
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          # Uninstall existing and pack tool locally
          dotnet tool uninstall -g atlas-ef || true
          dotnet restore ../../src/Atlas.Provider.Loader/Atlas.Provider.Loader.csproj
          dotnet pack ../../src/Atlas.Provider.Loader/Atlas.Provider.Loader.csproj -c Release -o ./nupkg
          
          # Extract version and install
          nupkg_file=$(find ./nupkg -name "atlas-ef.*.nupkg" ! -name "*symbols*" | head -1)
          version=$(basename "$nupkg_file" | sed 's/^atlas-ef\.//' | sed 's/\.nupkg$//')
          dotnet tool install --add-source ./nupkg --version "$version" -g atlas-ef
          echo "Installed atlas-ef version: $version"
          
      - name: Update Demo Project TargetFramework
        shell: pwsh
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          $csprojPath = "Atlas.Provider.Demo.csproj"
          [xml]$xml = Get-Content $csprojPath
          $updated = $false
          foreach ($pg in $xml.Project.PropertyGroup) {
            if ($pg.TargetFramework) {
              $pg.TargetFramework = "net${{ matrix.dotnet }}"
              $updated = $true
            }
            if ($pg.TargetFrameworks) {
              $pg.TargetFrameworks = "net${{ matrix.dotnet }}"
              $updated = $true
            }
          }
          if (-not $updated) {
            throw "No <TargetFramework> or <TargetFrameworks> element found in $csprojPath"
          }
          $xml.Save((Resolve-Path $csprojPath))
          Get-Content $csprojPath

      - name: Test tool without context flag (all contexts)
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas-ef -- sqlite

      - name: Test tool with context flag
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas-ef --context BloggingContext -- sqlite
          
      - name: Install Atlas CLI
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        
      - name: Verify Atlas CLI version
        shell: pwsh
        run: atlas version
        
      - name: Check migrations for sqlite
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=sqlite
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          
      - name: Check migrations for sqlite (with context)
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=sqlite --var context=BloggingContext
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          
      - name: Verify migrations generated
        shell: bash
        run: |
          if git status --porcelain | grep -v 'dotnet-tools.json' | grep -vq 'Atlas.Provider.Demo.csproj' ; then
            echo "You need to run 'atlas migrate diff --env ef' and commit the changes"
            echo ""
            git status --porcelain
            exit 1
          fi
  test:
    name: Test (${{ matrix.os }})
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake Test
        shell: pwsh
        run: dotnet cake --target=Test
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts ( ${{ matrix.os }} )
          path: "./artifacts/**/*.xml"

  publish-test-results:
    name: Publish Tests Results
    needs: test
    if: always()
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: "./artifacts"
      - name: Publish Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        if: always()
        with:
          paths: "./artifacts/*/*.xml"

  push-github-packages:
    name: Push GitHub Packages
    needs: test
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    environment:
      name: GitHub Packages
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      packages: write
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
      - name: Dotnet NuGet Add Source
        shell: pwsh
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json `
            --name GitHub --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }}
      - name: Dotnet NuGet Push
        shell: pwsh
        run: dotnet nuget push .\*.nupkg --api-key ${{ github.token }} --source GitHub --skip-duplicate

  push-nuget:
    name: Push NuGet Packages
    needs: test
    if: github.event_name == 'release'
    environment:
      name: NuGet
      url: https://www.nuget.org/packages/atlas-ef
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
      - name: Dotnet NuGet Push
        shell: pwsh
        run: |
          Get-ChildItem .\ -Filter *.nupkg |
          Where-Object { !$_.Name.Contains('preview') } |
          ForEach-Object {
            dotnet nuget push $_ --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }